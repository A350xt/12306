<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 12306火车票助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚄 12306火车票助手</h1>
            <nav>
                <a href="/">首页</a>
                <a href="/ui/search">车票查询</a>
                <a href="/ui/schedule">定时抢票</a>
                <a href="/ui/my_tickets">我的车票</a>
            </nav>
        </header>

        <main>
            <div class="login-container">
                <h2>用户登录</h2>

                <div class="login-tabs">
                    <button class="tab-btn active" onclick="showTab('qr')">扫码登录</button>
                    <button class="tab-btn" onclick="showTab('account')">账号登录</button>
                </div>

                <div id="qr-login" class="login-tab active">
                    <div class="qr-section">
                        <div id="qr-code" class="qr-placeholder">
                            <p>点击按钮获取二维码</p>
                        </div>
                        <button onclick="getQRCode()" class="btn">获取二维码</button>
                        <p id="qr-status" class="status-text"></p>
                    </div>
                </div>

                <div id="account-login" class="login-tab">
                    <form id="account-form">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="username" name="username" placeholder="请输入12306用户名" required>
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" id="password" name="password" placeholder="请输入密码" required>
                        </div>
                        <button type="submit" class="btn">登录</button>
                        <p id="account-status" class="status-text"></p>
                    </form>
                </div>
            </div>
        </main>

        <footer>
            <p>本项目仅供学习和研究使用，请遵守相关法律法规</p>
        </footer>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
